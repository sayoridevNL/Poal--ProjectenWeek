<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Wheel Selector</title>
<style>
    body {
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
    }

    h1 { margin-bottom: 20px; }

    .wheel-container {
        position: relative;
        width: 220px;
        height: 180px;
        overflow: hidden;
        border: 3px solid #444;
        border-radius: 20px;
        background: #222;
    }

    .wheel {
        position: absolute;
        top: 0;
        width: 100%;
        transition: transform 0.3s ease-out;
    }

    .item {
        height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0.4;
        transition: 0.3s;
    }

    .item img {
        width: 140px;
        height: 90px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 0 12px black;
    }

    /* Highlight center item */
    .selected {
        opacity: 1 !important;
        transform: scale(1.1);
    }

    #randomBtn {
        margin-top: 25px;
        padding: 12px 20px;
        background: gold;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .controls {
        margin-top: 15px;
        display: flex;
        gap: 15px;
    }

    .btn {
        padding: 10px 15px;
        background: #444;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-size: 18px;
    }

    #selectedDisplay {
        margin-top: 20px;
        font-size: 22px;
    }
</style>
</head>
<body>

<h1>Country Wheel Selector</h1>

<div class="wheel-container">
    <div class="wheel" id="wheel"></div>
</div>

<div class="controls">
    <button class="btn" onclick="move(-1)">▲</button>
    <button class="btn" onclick="move(1)">▼</button>
</div>

<button id="randomBtn">🎲 Random</button>

<div id="selectedDisplay"></div>

<script>
const countries = [
    { name: "Brazil", flag: "https://flagcdn.com/w320/br.png" },
    { name: "Argentina", flag: "https://flagcdn.com/w320/ar.png" },
    { name: "France", flag: "https://flagcdn.com/w320/fr.png" },
    { name: "Germany", flag: "https://flagcdn.com/w320/de.png" },
    { name: "Spain", flag: "https://flagcdn.com/w320/es.png" },
    { name: "Japan", flag: "https://flagcdn.com/w320/jp.png" },
    { name: "USA", flag: "https://flagcdn.com/w320/us.png" }
];

const wheel = document.getElementById("wheel");
const display = document.getElementById("selectedDisplay");

let index = 0;

// Build the items
countries.forEach(c => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
        <img src="${c.flag}">
        <div>${c.name}</div>
    `;
    wheel.appendChild(div);
});

function updateWheel() {
    const offset = -index * 180;
    wheel.style.transform = `translateY(${offset}px)`;

    document.querySelectorAll(".item").forEach((item, i) => {
        item.classList.toggle("selected", i === index);
    });

    display.textContent = "Selected: " + countries[index].name;
}

function move(direction) {
    index += direction;
    if (index < 0) index = countries.length - 1;
    if (index >= countries.length) index = 0;
    updateWheel();
}

document.getElementById("randomBtn").onclick = () => {
    index = Math.floor(Math.random() * countries.length);
    updateWheel();
};

// Mouse wheel support
document.querySelector(".wheel-container").addEventListener("wheel", e => {
    e.preventDefault();
    move(e.deltaY > 0 ? 1 : -1);
});

updateWheel();
</script>

</body>
</html>
