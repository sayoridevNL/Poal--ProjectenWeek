<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="audio/By Myself - The Grey Room _ Clark Sims.ogg" type="audio/mpeg">
    </audio>
    <audio id="Bong">
        <source src="audio/bong.ogg" type="audio/mpeg">
    </audio>

    <div id="startMenu">
       <div id="Beginscherm">
            <img src="images/logo_poal.png"></img>
            <!--start en settings button-->
            <div class="button-container">
                <button id="startBtn" style="vertical-align:middle"><span>Start</span></button>
            </div>
            </div>
        </div> 
    </div>
    <!-- Country select popup shown after Start -->
    <div id="countrySelectPopup" class="popup">
      <div id="countrySelectContent">
        <h2>Kies een land voor beide spelers</h2>

        <div class="selection-container">

          <!-- PLAYER 1 -->
          <div class="player-select">
              <h3>Speler 1</h3>

              <div class="wheel-container">
                  <div class="wheel" id="wheelP1"></div>
              </div>
              <div class="wheel-controls">
                <button id="wheelP1Up" class="wheel-btn">▲</button>
                <button id="wheelP1Down" class="wheel-btn">▼</button>
              </div>
          </div>

          <!-- PLAYER 2 -->
          <div class="player-select">
              <h3>Speler 2</h3>

              <div class="wheel-container">
                  <div class="wheel" id="wheelP2"></div>
              </div>
              <div class="wheel-controls">
                <button id="wheelP2Up" class="wheel-btn">▲</button>
                <button id="wheelP2Down" class="wheel-btn">▼</button>
              </div>
          </div>

        </div>

        <div class="controls">
            <button id="randomize">Willekeurig</button>
            <button id="countryStartBtn">Start</button>
        </div>

        <p id="summary">— vs —</p>

      </div>
    </div>

    <h1 id="score"></h1>
    <div id="veld">
        <div id="goal1"></div>
        <div id="goal2"></div>
       <div id="player1"><img src="images/Netherlands.webp" alt="Blue Team Flag"></div>
        <div id="npc1_1"></div>
        <div id="npc1_2"></div>
        <div id="player2"><img src="images/Antarctica.webp" alt="Red Team Flag"></div>
        <div id="npc2_1"></div>
        <div id="npc2_2"></div>
        <div id="ball"></div>
        <div id="powerup1" class="powerup">?</div>
        <div id="middleLine"></div>
        <div id="middlecircle"></div>
    </div>
    <h1 id="timer"></h1>
    <h3 id="powerText"></h3>
    <div id="gameOverPopup" class="popup">
        <div id="popup-content">
            <img src="images/logo_poal.png" alt="Game Logo">
            <h2 id="popupTitle">Game Over!</h2>
            <p id="popupScore"></p>
            <button id="replayBtn">Rematch</button>
            <button id="backToMenuBtn">Back to Menu</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
